[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-analysis-cli"
version = "0.2.0"
description = "tax-analysis-skill 的命令行适配器"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.27,<1",
    "rich>=13,<15",
    "requests>=2.25,<3",
    "urllib3>=1.26,<3",
    "playwright>=1.40,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
tax-analysis = "tax_engine_cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tax_engine_cli = [
    "runtime/MANIFEST.json",
    "runtime/scripts/*.py",
    "runtime/data/*.json",
    "runtime/references/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
